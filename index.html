<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCFS: カンボジア漁業インパクト投資</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

    <nav class="sticky top-0 w-full z-50 bg-white/95 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <div class="flex items-center cursor-pointer" onclick="switchView('home')">
                <div class="bg-blue-800 text-white p-2 rounded mr-3 font-black text-xl">JC</div>
                <span class="text-2xl font-bold tracking-tight text-slate-900">JCFS <span class="text-blue-700">Project</span></span>
            </div>
            <div class="hidden lg:flex space-x-8 text-sm font-bold text-slate-500 uppercase">
                <a href="javascript:switchView('home')" class="hover:text-blue-800">ホーム</a>
                <a href="javascript:switchView('strategy')" class="hover:text-blue-800">コッコン州詳細</a>
                <a href="javascript:switchView('tech')" class="hover:text-blue-800">技術詳細</a>
                <a href="#simulation-start" class="hover:text-blue-800">シミュレーション</a>
            </div>
            <button class="bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 px-6 rounded shadow-md transition">
                お問い合わせ
            </button>
        </div>
    </nav>

    <main>
        <div id="view-home" class="view-section active">
            <header class="gradient-header py-24 text-white">
                </header>

            <section class="py-20 bg-white">
                <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row gap-12 items-center">
                    <div class="md:w-1/2">
                        <h2 class="text-3xl font-black text-slate-900 mb-6 border-l-8 border-blue-800 pl-4">最重要拠点：チュロイスヴァイ村</h2>
                        <p class="text-slate-600 mb-6 leading-relaxed">コッコン州の中でもリーダー的存在の村。ここでの成功は全土への展開モデルとなります。</p>
                        <div class="flex gap-4">
                            <button onclick="switchView('strategy')" class="bg-blue-800 text-white font-bold py-3 px-8 rounded shadow hover:bg-blue-900 transition">詳細へ</button>
                            <button onclick="switchView('tech')" class="bg-amber-700 text-white font-bold py-3 px-8 rounded shadow hover:bg-amber-800 transition">技術優位</button>
                        </div>
                    </div>
                    <div class="md:w-1/2 grid gap-4">
                        <div class="bg-slate-50 p-6 rounded-xl border-l-4 border-blue-800 hover-lift">
                            <h4 class="font-bold text-blue-900 mb-1">漁獲価値の劇的向上</h4>
                            <p class="text-xs text-slate-500">活魚輸送により市場単価が数倍に向上。</p>
                        </div>
                        <div class="bg-slate-50 p-6 rounded-xl border-l-4 border-amber-600 hover-lift">
                            <h4 class="font-bold text-amber-800 mb-1">安全性と効率の両立</h4>
                            <p class="text-xs text-slate-500">不沈構造のFRP船が漁師の命を守ります。</p>
                        </div>
                    </div>
                </div>
            </section>

            </div>

        <div id="view-strategy" class="view-section">
            </div>

        <div id="view-tech" class="view-section">
            </div>
    </main>

    <footer class="bg-slate-900 py-16 text-center text-slate-500 text-[10px]">
        </footer>

    <script src="app.js"></script>
</body>
</html>
